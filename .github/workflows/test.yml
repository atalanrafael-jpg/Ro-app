name: test

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.lock
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long --maxfail=1 --junitxml=pytest-results.xml | tee pytest-output.txt
      - name: Build production container
        run: docker build --pull --tag marsel-roapp:${GITHUB_SHA} .
      - name: Verify production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name marsel-roapp-ci -p 18000:8000 marsel-roapp:${GITHUB_SHA}
          trap 'docker logs marsel-roapp-ci || true; docker stop marsel-roapp-ci || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Build test manifest
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}";
            echo "run=${GITHUB_RUN_ID}";
            echo "workflow=${GITHUB_WORKFLOW}";
            echo "python=$(python --version 2>&1)";
            echo "pytest=$(python -m pytest --version 2>&1)";
            echo "docker=$(docker --version 2>&1)";
          } > test-manifest.txt
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: marsel-test-evidence-${{ github.run_id }}
          path: |
            pytest-results.xml
            pytest-output.txt
            test-manifest.txt
          if-no-files-found: warn
          retention-days: 90
